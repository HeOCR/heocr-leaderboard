name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # catch a change to the site's results.json before a visitor does
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check-live
